<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gorjeta da Sorte</title>
<style>
  :root{
    --green:#0B3D2E;
    --green-2:#12593F;
    --gold:#F2C84B;
    --gold-2:#E0A82E;
    --cream:#FFF8E7;
    --red:#C0392B;
    --ink:#1A1A1A;
    --muted:#6B6B5E;
    --shadow:0 18px 40px rgba(11,61,46,.18), 0 2px 6px rgba(11,61,46,.08);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(1000px 600px at 85% -10%, rgba(242,200,75,.28), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(192,57,43,.18), transparent 55%),
      var(--cream);
    color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    display:flex;
    flex-direction:column;
  }

  header.brand{
    display:flex;align-items:center;gap:.6rem;
    padding:1.25rem clamp(1rem,4vw,2rem);
  }
  .brand__mark{
    width:38px;height:38px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--gold) 0%, var(--gold-2) 60%, #8a6a14 100%);
    display:grid;place-items:center;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.15);
    color:var(--green);
    flex:none;
  }
  .brand__title{
    font-family:"Georgia",serif;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:.02em;
    color:var(--green);
  }
  .brand__title em{font-style:italic;color:var(--red)}

  main{
    flex:1;
    display:grid;
    place-items:start center;
    padding:clamp(1rem,3vw,2rem) clamp(1rem,4vw,2rem) 2rem;
  }

  .card{
    width:min(960px,100%);
    background:var(--cream);
    border-radius:24px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    border:1px solid rgba(11,61,46,.08);
  }
  @media (max-width:780px){
    .card{grid-template-columns:1fr}
  }

  .card__intro{
    padding:clamp(1.5rem,3vw,2.25rem);
    background:
      linear-gradient(160deg, var(--green) 0%, var(--green-2) 100%);
    color:var(--cream);
    position:relative;
    overflow:hidden;
  }
  .card__intro::after{
    content:"";
    position:absolute;inset:auto -30% -40% auto;
    width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle, rgba(242,200,75,.25), transparent 60%);
    pointer-events:none;
  }
  .eyebrow{
    display:inline-block;
    font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(242,200,75,.4);
    padding:.25rem .6rem;border-radius:999px;
    margin-bottom:1rem;
  }
  h1{
    font-family:"Georgia",serif;
    font-weight:700;
    font-size:clamp(2rem,4.2vw,2.75rem);
    margin:0 0 .75rem;
    line-height:1.1;
  }
  h1 span{color:var(--gold);font-style:italic}
  .lede{
    font-size:1.05rem;
    color:rgba(255,248,231,.88);
    margin:0 0 1.25rem;
  }

  .field{
    display:block;margin-top:1.25rem;
  }
  .field__label{
    display:block;
    font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(255,248,231,.75);
    margin-bottom:.4rem;
  }
  .field__input{
    position:relative;
    display:flex;align-items:center;
    background:rgba(255,248,231,.08);
    border:1px solid rgba(242,200,75,.35);
    border-radius:14px;
    padding:.25rem .9rem;
    transition:border-color .15s ease, background .15s ease;
  }
  .field__input:focus-within{
    border-color:var(--gold);
    background:rgba(255,248,231,.14);
  }
  .field__prefix{
    color:var(--gold);
    font-weight:700;
    margin-right:.4rem;
    font-variant-numeric:tabular-nums;
  }
  .field__input input{
    flex:1;
    background:transparent;border:0;outline:0;
    color:var(--cream);
    font-size:1.25rem;font-weight:600;
    padding:.7rem 0;
    font-variant-numeric:tabular-nums;
  }
  .field__input input::placeholder{color:rgba(255,248,231,.45)}

  .btn{
    appearance:none;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    padding:.9rem 1.4rem;
    border-radius:999px;
    border:0;
    font-weight:700;font-size:1rem;
    letter-spacing:.02em;
    transition:transform .12s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .btn--primary{
    background:linear-gradient(180deg,var(--gold) 0%,var(--gold-2) 100%);
    color:var(--green);
    box-shadow:0 10px 24px rgba(242,200,75,.35), inset 0 -2px 0 rgba(0,0,0,.12);
  }
  .btn--primary:hover{transform:translateY(-1px)}
  .btn--primary:active{transform:translateY(0)}
  .btn--primary:disabled{opacity:.65;cursor:not-allowed;transform:none}
  .btn--ghost{
    background:transparent;
    color:var(--green);
    border:1.5px solid rgba(11,61,46,.25);
  }
  .btn--ghost:hover{background:rgba(11,61,46,.06)}

  .actions{margin-top:1.5rem;display:flex;gap:.75rem;flex-wrap:wrap}

  .card__wheel{
    padding:clamp(1.5rem,3vw,2.25rem);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.25rem;
    background:
      radial-gradient(400px 260px at 50% 0%, rgba(242,200,75,.18), transparent 70%),
      var(--cream);
  }

  .wheel-wrap{
    position:relative;
    width:min(340px,78vw);
    aspect-ratio:1/1;
  }
  .wheel-pointer{
    position:absolute;
    top:-4px;left:50%;transform:translateX(-50%);
    width:0;height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:22px solid var(--red);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
    z-index:3;
  }
  .wheel{
    position:absolute;inset:0;
    border-radius:50%;
    background:
      conic-gradient(
        var(--gold)       0deg  60deg,
        var(--green)     60deg 120deg,
        var(--gold)     120deg 180deg,
        var(--green)    180deg 240deg,
        var(--gold)     240deg 300deg,
        var(--green)    300deg 360deg
      );
    box-shadow:
      0 0 0 8px var(--green),
      0 0 0 10px var(--gold),
      0 14px 28px rgba(11,61,46,.25);
    transform:rotate(0deg);
    transition:transform 4.2s cubic-bezier(.16,.84,.24,1);
  }
  .wheel.spin-reduced{transition-duration:.4s}

  .wheel__labels{
    position:absolute;inset:0;
    pointer-events:none;
  }
  .wheel__labels span{
    position:absolute;
    top:50%;left:50%;
    transform-origin:0 0;
    font-family:"Georgia",serif;
    font-weight:700;
    font-size:1.1rem;
    color:var(--cream);
    text-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .wheel__labels span.dark{color:var(--green);text-shadow:none}

  .wheel-hub{
    position:absolute;
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:18%;height:18%;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff 0%, var(--gold) 55%, var(--gold-2) 100%);
    box-shadow:inset 0 0 0 3px var(--green), 0 2px 6px rgba(0,0,0,.25);
    z-index:2;
  }

  .result{
    width:100%;
    background:#fff;
    border:1px solid rgba(11,61,46,.1);
    border-radius:18px;
    padding:1.1rem 1.25rem;
    text-align:center;
    opacity:0;transform:translateY(8px);
    transition:opacity .35s ease, transform .35s ease;
    pointer-events:none;
  }
  .result.is-visible{opacity:1;transform:translateY(0);pointer-events:auto}
  .result__percent{
    font-family:"Georgia",serif;
    font-size:2.4rem;font-weight:700;color:var(--green);
    line-height:1;
  }
  .result__percent em{color:var(--red);font-style:normal}
  .result__amounts{
    margin:.5rem 0 .25rem;
    font-size:1rem;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .result__amounts strong{color:var(--green)}
  .result__fortune{
    margin:.5rem 0 .75rem;
    font-style:italic;color:var(--muted);
    font-size:.95rem;
  }

  footer{
    padding:1.25rem clamp(1rem,4vw,2rem) 1.75rem;
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
  }
  footer strong{color:var(--green)}

  @media (prefers-reduced-motion:reduce){
    .wheel{transition-duration:.4s !important}
    .result{transition-duration:.1s}
  }
</style>
</head>
<body>
  <header class="brand">
    <span class="brand__mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3c1.4 2.6 3.6 3.4 6.2 3.4-0 2.6-.8 4.8-3.4 6.2-2.6 1.4-3.4 3.6-3.4 6.2-1.4-2.6-3.6-3.4-6.2-3.4 0-2.6.8-4.8 3.4-6.2C10.8 7.8 11.6 5.6 12 3z" fill="currentColor"/>
      </svg>
    </span>
    <span class="brand__title">Gorjeta <em>da Sorte</em></span>
  </header>

  <main>
    <section class="card" aria-labelledby="titulo">
      <div class="card__intro">
        <span class="eyebrow">Roleta da gratidão</span>
        <h1 id="titulo">Sua gorjeta não é obrigação.<br><span>É sorte.</span></h1>
        <p class="lede">Digite o valor da conta, gire a roleta e descubra quanto de gorjeta o destino sugere pra você hoje.</p>

        <label class="field">
          <span class="field__label">Valor da conta</span>
          <span class="field__input">
            <span class="field__prefix" aria-hidden="true">R$</span>
            <input
              id="bill"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              placeholder="0,00"
              aria-label="Valor da conta em reais"
            >
          </span>
        </label>

        <div class="actions">
          <button id="spin" class="btn btn--primary" type="button">
            Girar a roleta
          </button>
          <button id="reset" class="btn btn--ghost" type="button" hidden>
            Girar de novo
          </button>
        </div>
      </div>

      <div class="card__wheel">
        <div class="wheel-wrap" aria-hidden="true">
          <div class="wheel-pointer"></div>
          <div id="wheel" class="wheel">
            <div class="wheel__labels" id="wheelLabels"></div>
          </div>
          <div class="wheel-hub"></div>
        </div>

        <div
          id="result"
          class="result"
          aria-live="polite"
          aria-atomic="true"
        >
          <div class="result__percent"><em id="resPct">—</em>%</div>
          <div class="result__amounts" id="resAmounts"></div>
          <div class="result__fortune" id="resFortune"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <strong>Gorjeta justa</strong> é sempre a maior sorte — de quem recebe e de quem dá.
  </footer>

<script>
(() => {
  const SEGMENTS = [10, 15, 20, 12, 18, 25]; // clockwise from top, matches wheel colors
  const FORTUNES = [
    "Generosidade volta em dobro. Hoje você plantou bem.",
    "Pequenos gestos, grandes histórias. Obrigado por notar.",
    "Quem serve com carinho merece ser lembrado com carinho.",
    "A sorte sorri pra quem divide o pão — e a mesa.",
    "Gratidão é uma moeda que nunca desvaloriza.",
    "Sua conta fecha aqui; a alegria de quem te serviu continua."
  ];

  const fmtBRL = new Intl.NumberFormat('pt-BR', {
    style: 'currency', currency: 'BRL'
  });

  const $bill = document.getElementById('bill');
  const $spin = document.getElementById('spin');
  const $reset = document.getElementById('reset');
  const $wheel = document.getElementById('wheel');
  const $labels = document.getElementById('wheelLabels');
  const $result = document.getElementById('result');
  const $resPct = document.getElementById('resPct');
  const $resAmounts = document.getElementById('resAmounts');
  const $resFortune = document.getElementById('resFortune');

  // Render numeric labels on the wheel, centered within each 60° segment.
  SEGMENTS.forEach((pct, i) => {
    const el = document.createElement('span');
    el.textContent = pct + '%';
    // Alternating segments: even = gold (dark text), odd = green (light text)
    if (i % 2 === 0) el.classList.add('dark');
    const angle = i * 60 + 30; // center of segment
    const radius = 38; // % from center
    const rad = (angle - 90) * Math.PI / 180;
    const x = Math.cos(rad) * radius;
    const y = Math.sin(rad) * radius;
    el.style.transform =
      `translate(calc(${x}% - 50%), calc(${y}% - 50%)) rotate(${angle}deg)`;
    $labels.appendChild(el);
  });

  const parseBRL = (raw) => {
    if (!raw) return 0;
    // Accept "120,50", "120.50", "1.234,56", "1,234.56"
    const cleaned = String(raw).replace(/\s/g, '');
    // If both , and . present, assume the last one is the decimal sep.
    const lastComma = cleaned.lastIndexOf(',');
    const lastDot = cleaned.lastIndexOf('.');
    let normalized;
    if (lastComma === -1 && lastDot === -1) {
      normalized = cleaned;
    } else if (lastComma > lastDot) {
      normalized = cleaned.replace(/\./g, '').replace(',', '.');
    } else {
      normalized = cleaned.replace(/,/g, '');
    }
    const n = parseFloat(normalized);
    return Number.isFinite(n) && n >= 0 ? n : 0;
  };

  let currentRotation = 0;
  let spinning = false;

  const setResult = (pct, bill) => {
    $resPct.textContent = pct;
    if (bill > 0) {
      const tip = bill * pct / 100;
      const total = bill + tip;
      $resAmounts.innerHTML =
        `Gorjeta: <strong>${fmtBRL.format(tip)}</strong>` +
        ` · Total: <strong>${fmtBRL.format(total)}</strong>`;
    } else {
      $resAmounts.innerHTML =
        `<span style="color:var(--muted)">Informe o valor da conta para ver o total.</span>`;
    }
    $resFortune.textContent = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
    $result.classList.add('is-visible');
  };

  const spin = () => {
    if (spinning) return;
    spinning = true;
    $spin.disabled = true;
    $reset.hidden = true;
    $result.classList.remove('is-visible');

    const segIdx = Math.floor(Math.random() * SEGMENTS.length);
    const pct = SEGMENTS[segIdx];

    // Segment centers are at 30°, 90°, 150°, ...; pointer is at the top (0°).
    // To place segIdx under the pointer: rotate the wheel so the segment
    // center ends up at 0°, i.e. rotate by -(segIdx*60 + 30), plus full turns.
    const turns = 4 + Math.floor(Math.random() * 3); // 4–6 full spins
    const target = turns * 360 - (segIdx * 60 + 30);
    // Keep rotation monotonically increasing to play well with CSS transitions.
    while (target <= currentRotation) {
      currentRotation -= 360;
    }
    currentRotation = target;
    $wheel.style.transform = `rotate(${currentRotation}deg)`;

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) $wheel.classList.add('spin-reduced');

    const onEnd = () => {
      $wheel.removeEventListener('transitionend', onEnd);
      $wheel.classList.remove('spin-reduced');
      spinning = false;
      $spin.disabled = false;
      $reset.hidden = false;
      setResult(pct, parseBRL($bill.value));
      $reset.focus();
    };
    $wheel.addEventListener('transitionend', onEnd, { once: true });
  };

  const reset = () => {
    $result.classList.remove('is-visible');
    $reset.hidden = true;
    $bill.focus();
  };

  $spin.addEventListener('click', spin);
  $reset.addEventListener('click', reset);

  // Allow Enter in the bill input to spin.
  $bill.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); spin(); }
  });
})();
</script>
</body>
</html>
